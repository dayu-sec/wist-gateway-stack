name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 打包：整仓内容（除 CI 自身的 .github）打成部署包。
  # 用 git archive 出包，只收 git 跟踪的内容 —— dev/bin/（约 92M 本地二进制）、
  # data-plane/{data,.run}/、configs/ 与 identity/（现场生成，已 ignore）、values/、_gal/.report
  # 等都未入 git，天然不入包；sys/configs/web/nginx.conf.tpl 随仓入库，会进包。
  # 变量解析产物 sys/merged_vars.yml 是 gops 文档标注“需入库”的文件，已在仓库里、
  # 随 git archive 进包，所以这里不需要跑 gops。
  # 纪律：改了 sys/setting/vars.yml 后，本地跑一次 `gops sys update` 并把 merged_vars.yml
  # 的变更一起提交，否则包里带的是旧值。
  package:
    name: Package deployment bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build tarball
        run: |
          set -eu
          bundle="wist-gateway-stack-${GITHUB_REF_NAME}"
          # 注意：**不要**加 --prefix —— gops 解包时会自建同名目录（~/ds-package/<包名>/），
          # 包内再套一层会导致 prj import 找不到 sys/sys_model.yml。
          # 变量文件 sys/merged_vars.yml 由仓库带上，不必在 CI 里现算。
          git archive \
            --format=tar \
            HEAD -- . ':(exclude).github' > "${bundle}.tar"
          gzip -9 "${bundle}.tar"
          echo "包内关键文件："
          tar -tzf "${bundle}.tar.gz" | grep -E "sys/.*vars\.yml|sys/sys_model\.yml|sys/docker-compose\.yml"
          ls -lh "${bundle}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: wist-gateway-stack
          path: wist-gateway-stack-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 发布到 GitHub Release，供中心作为版本制品下载。
  release:
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wist-gateway-stack
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz

  # 可选：把本仓制品推到腾讯云 COS（对象存储），供中心 / CDN / 客户端按稳定 URL 拉取。
  # 未配置 Variables（COS_BUCKET 为空）时整段自动跳过，不会让发布失败；
  # 一旦设置 COS_BUCKET 即视为启用，此时密钥缺失会直接报错（便于发现漏配）。
  # 注意：`secrets` 上下文不能出现在 step 级 if 里，故启用判定放在 job 级（只看 vars）。
  #   Variables：COS_BUCKET（含 -APPID）、COS_REGION（如 ap-guangzhou）、可选 COS_PREFIX（默认取仓库名）
  #   Secrets：  COS_SECRET_ID、COS_SECRET_KEY（临时密钥再加 COS_SESSION_TOKEN）
  # 对象键：<COS_PREFIX>/<tag>/<文件名> 与 <COS_PREFIX>/latest/<文件名>
  upload-cos:
    name: Upload artifacts to Tencent COS
    needs: [release]
    runs-on: ubuntu-24.04
    if: ${{ vars.COS_BUCKET != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pkg
          merge-multiple: true

      - name: Install coscli
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/coscli" \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          chmod +x "$HOME/.local/bin/coscli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/coscli" --version

      - name: Upload to COS
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # 去掉密钥里的空白字符：粘贴常带入尾随换行/空格，会让签名报 SecretKey is invalid。
          secret_id="$(printf '%s' "${COS_SECRET_ID}" | tr -d '[:space:]')"
          secret_key="$(printf '%s' "${COS_SECRET_KEY}" | tr -d '[:space:]')"
          session_token="$(printf '%s' "${COS_SESSION_TOKEN}" | tr -d '[:space:]')"
          # 明文写入 AK/SK，因此必须显式关掉 coscli 的密钥加密（disableencryption）。
          cat > "$HOME/.cos.yaml" <<EOF
          cos:
            base:
              protocol: https
              disableencryption: "true"
              secretid: "${secret_id}"
              secretkey: "${secret_key}"
              sessiontoken: "${session_token}"
            buckets:
              - name: "${COS_BUCKET}"
                alias: "${COS_BUCKET}"
                region: "${COS_REGION}"
                endpoint: "cos.${COS_REGION}.myqcloud.com"
          EOF
          prefix="${COS_PREFIX:-${GITHUB_REPOSITORY##*/}}"
          prefix="${prefix%/}"
          cfg="$HOME/.cos.yaml"
          out="$PWD/coscli_output"
          rm -rf "${out}"
          # coscli 只打印汇总，失败明细落在 coscli_output/<时间>/ 下；失败时打印并输出为 annotation。
          dump_err() {
            echo "::error::$1"
            if [ -d "${out}" ]; then
              find "${out}" -type f -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
              detail="$(find "${out}" -type f -exec cat {} \; | tr '\n' ' ' | sed -e 's/%/%25/g' | cut -c1-1500)"
              echo "::error title=coscli 明细::$1 —— ${detail}"
            fi
            exit 1
          }
          shopt -s nullglob
          files=(pkg/*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::pkg/ 下没有制品可上传"; exit 1; }
          for f in "${files[@]}"; do
            [ -f "${f}" ] || continue
            name="$(basename "${f}")"
            coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/${TAG}/${name}" -c "${cfg}" \
              || dump_err "上传 ${name} 失败（${TAG}）"
            coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/latest/${name}" -c "${cfg}" \
              || dump_err "上传 ${name} 失败（latest）"
          done
          echo "COS 上传完成。"
          coscli ls "cos://${COS_BUCKET}/${prefix}/" -c "${cfg}" \
            || echo "::warning::COS 列表失败（可能缺 cos:GetBucket 权限）；上传本身已成功。"
