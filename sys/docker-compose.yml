# wist-gateway-stack — 网关控制台 + 数据平台(WarpParse) + 观测 一站式编排
#
# 端口约定（宿主:容器；宿主端口的值见 sys/setting/vars.yml）：
#   gateway          3000:3000     控制面后端（HTTPS，wist-gateway-web 的 /api 目标）
#   web              8443:80       前端入口（静态托管 + /api 反代）
#   victoria-metrics 18429:8428    指标（与 wist-gateway 默认 victoria_metrics_url 对齐）
#   wparse           无对外端口    数据面（ELT，接 source/sink）
#
# 值来源（gops 系统约定）：
#   - 随环境/客户变化的量（镜像源与 tag、宿主端口、保留期、时区、挂载路径）统一用
#     Compose 原生 `${VAR}` 占位，定义在 sys/setting/vars.yml；
#     `gops sys update` → sys/resolved_vars.yml，`gops sys localize` → 同目录 .env。
#     客户覆盖写 values/value.yml（该文件版本化），不要改生成物。
#   - 容器内端口/路径/服务名是应用契约，直接写在这里。
#   - 本栈当前无密钥；如需，用 ${SEC_xxx} 占位，由 `gops sys start` 注入、不落盘。

services:
  # ── 观测：指标 ──
  victoria-metrics:
    image: victoriametrics/victoria-metrics:${VM_TAG}
    restart: unless-stopped
    ports:
      - "${VM_PORT}:8428"
    volumes:
      - metrics_data:/storage
    command:
      - --envflag.enable
      - --envflag.prefix=VM_
      - --loggerFormat=json
      - --retentionPeriod=${RETENTION_PERIOD}
      - --storageDataPath=/storage
      - --search.latencyOffset=0s
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── 数据平台：WarpParse（ELT 引擎）──
  # WPARSE_IMAGE 来自上游镜像仓库，客户可用 values/value.yml 覆盖成内网镜像仓库。
  # 挂载约定（镜像里 /data 属非 root 用户 wparse(uid 999)）：
  #   - 配置（conf/connectors/models/topology）从 data-plane/ 只读共用，它是唯一源；
  #   - 运行态直接挂到 /data 下的两个子路径：/data/data（输出）与 /data/.run（引擎状态）。
  # 关键：**不挂 /data 这一整根**。把运行目录挂成 /data（父挂载）、配置再嵌进去，会让 Docker
  # 在宿主运行目录里建出一堆空白挂载点目录；改成直接挂 /data/data 与 /data/.run 后，所有
  # 挂载点都建在容器层里，宿主运行目录保持干净。
  # 运行态用**宿主目录 bind 挂载**（不是命名卷）：Linux 上要保证这两个目录对 uid 999 可写。
  #
  # 单实例保障：引擎自身**没有**单实例保护（同名 work root 起两个会互写 .run/ 与输出），
  # 所以 entrypoint 先用 flock 独占 /data/.run/.wparse.lock（落在宿主 WPARSE_RUN_STATE 内）再把引擎交给 PID 1：
  #   -F（不 fork）→ wparse 自己就是 PID 1，docker stop 的 SIGTERM 直达引擎、能优雅退出；
  #   -n → 拿不到锁立即失败（不排队），避免“默默等锁”看不出配错了；
  #   --verbose + -E 75 → 失败时日志打 `flock: failed to get lock`、容器以 75 退出。
  # 开发态脚本（dev/svc.sh）用同一把锁，所以容器与宿主也不会同时跑。
  # 这层包装是绕过：引擎自身应当持锁 —— 已提上游 wp-labs/warp-parse#365，
  # 上游实现后这里的 entrypoint 可以直接去掉。
  wparse:
    image: ${WPARSE_IMAGE}:${WPARSE_TAG}
    restart: unless-stopped
    entrypoint: ["/usr/bin/flock", "--verbose", "-n", "-E", "75", "-F", "/data/.run/.wparse.lock", "/usr/local/bin/wparse"]
    command: ["daemon", "--work-root", "/data"]
    environment:
      WPARSE_VM_ENDPOINT: http://victoria-metrics:8428
      # 数据面 sink（agent-facts / agent-logs）用的网关内部接入端点；
      # 与网关配置的 [ingest].listen_addr 对应（明文 HTTP，只走 compose 内网）。
      WPARSE_GATEWAY_ENDPOINT: http://gateway:3001
    volumes:
      # 配置源（唯一源，只读共用）
      - ${WPARSE_WORK_DIR}/conf:/data/conf:ro
      - ${WPARSE_WORK_DIR}/connectors:/data/connectors:ro
      - ${WPARSE_WORK_DIR}/models:/data/models:ro
      - ${WPARSE_WORK_DIR}/topology:/data/topology:ro
      # 运行态：宿主目录直接挂到 /data 的子路径（不挂父 /data）
      - ${WPARSE_RUN_DATA}:/data/data
      - ${WPARSE_RUN_STATE}:/data/.run
    ports:
      # agent 数据面入口（wparse source tcp_1）。明文，需对 agent 可达；
      # 管控面 agent 上送地址由网关下发（/api/v1/admin/agent/uplink），要与这里一致。
      - "${WPARSE_PORT}:9000"
    depends_on:
      victoria-metrics:
        condition: service_healthy

  # ── 控制面后端 ──
  gateway:
    # 本地零配置联调可换成 bootstrap 镜像（image 改成 wist-gateway:bootstrap）
    image: ${IMAGE_SPC}/wist-gateway:${GATEWAY_TAG}
    restart: unless-stopped
    environment:
      WIST_GATEWAY_CONFIG: /config/wist-gateway.toml
    volumes:
      - ${GATEWAY_CONFIG_DIR}:/config
      # 安装包投放目录（只读）：界面「本地来源」填 /packages/<文件名>。
      # 容器读不到宿主任意路径，本地包必须先落到这个被挂进来的目录。
      - ${PACKAGE_DIR}:/packages:ro
    ports:
      - "${GATEWAY_PORT}:3000"
    depends_on:
      victoria-metrics:
        condition: service_healthy

  # ── 前端 ──
  web:
    image: ${IMAGE_SPC}/wist-gateway-web:${WEB_TAG}
    restart: unless-stopped
    volumes:
      - ${WEB_NGINX_CONF}:/etc/nginx/conf.d/default.conf:ro
      # 页面自己的 TLS 证书（与网关证书分开；由 scripts/init-web-tls.sh 生成）
      - ${WEB_TLS_DIR}:/certs:ro
    ports:
      - "${WEB_PORT}:443"
    depends_on:
      - gateway

volumes:
  metrics_data:
    driver: local
