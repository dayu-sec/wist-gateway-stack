version = "1.0"
robust = "normal"
skip_parse = false
skip_sink = false
gen_event_md5 = false

[models]
wpl = "./models/wpl"
oml = "./models/oml"
knowledge = "./models/knowledge"

[topology]
sources = "./topology/sources"
sinks = "./topology/sinks"

[performance]
rate_limit_rps = 0
parse_workers = 2
reload_timeout_ms = 10000
fetch_timeout_ms = 300

[rescue]
path = "./data/rescue"

[log_conf]
level = "warn,ctrl=info,data=error,matrc=error,dfx=warn,kdb=warn"
output = "File"

[log_conf.file]
path = "./data/logs/"

[[stat.pick]]
key = "pick_stat"
target = "*"

[[stat.parse]]
key = "parse_stat"
target = "*"

[[stat.sink]]
key = "sink_stat"
target = "*"

[semantic]
enabled = false

[project_remote]
# 规则/配置从 Center Git Proxy 拉取（Gateway 不持有 CNB 凭据）。
# 容器启动时把 data-plane/ 作为只读种子复制到 data-plane-run/work，本段会写工作根。
enabled = true
repo = ""
init_version = ""

[project_remote.models]
# 由 Gateway 容器环境注入（Gateway 主机视角的 Center Git Proxy 地址）。
repo = "${WPARSE_PROJECT_MODELS_REPO}"
init_version = ""

[project_remote.infra]
repo = "${WPARSE_PROJECT_INFRA_REPO}"
init_version = ""

[admin_api]
# 容器内绑 0.0.0.0 + TLS（非回环绑定必须 TLS）；宿主只发布 127.0.0.1:19090。
# 由本机 gwlinkd 调用，用于 WarpStation 的发布/状态查询。
enabled = true
bind = "0.0.0.0:19090"
request_timeout_ms = 15000
max_body_bytes = 4096

[admin_api.tls]
enabled = true
cert_file = "/data/identity/admin-tls.crt.pem"
key_file = "/data/identity/admin-tls.key.pem"

[admin_api.auth]
mode = "bearer_token"
# 相对工作根 /data；由 scripts/init-wparse-admin.sh 生成（600/gops perms 对齐）。
token_file = ".run/admin_api.token"
