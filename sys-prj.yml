test_envs:
  dep_root: ''
  deps: []

# `gops sys package` 打包时排除的路径（glob，相对系统根；默认模式与 `--full` **都生效**）。
#
# 站点身份（CA / 证书 / 私钥 / 对外域名）**不在资源树里**，它们是**站点级、dev/prod 共用**的唯一一份，
# 放在栈根的 `identity/`，并整体作为**对外契约**声明（见下面 `contract:`）——身份是「证书 + 私钥」一对，
# 拆开就不自足（丢私钥 = 签不出新叶/客户端证书 = 换锚），所以**整目录进 contract**、不再分 public/private。
# 资源树（`configs/` 发布态、`dev/` 开发态）里只有**可重建 / 每部署一份**的东西（渲染物、运行态、store、
# 日志），故可**整目录**声明。
#
# 身份/内容要跟着交付走，走的是它们自己的通路，不是系统包：
#   身份：`gops prj contract export/import`（或在栈根 `scripts/backup-gateway.sh`）
#   内容：KNOWLEDGE_PKG_URL（或现场投放 configs/gateway/knowledge/initial/）
ignore:
  # 栈根现场密钥文件：`WIST_GATEWAY_SEC_FILE` 默认指向 `.wist/sec-value.yml`（网关 admin token）。
  # 密钥绝不进交付包；默认模式靠 `.gitignore` 挡住，这条是 **`--full` 模式的护栏**。
  - .wist
  # wparse 运行态根（WPARSE_RUN_DATA / WPARSE_RUN_STATE）：pid / 锁 / 引擎自带的 sqlite 与输出。
  - data-plane-run
  # 开发态资源：本地二进制（~92M，随平台而异）+ dev 运行态（含 store / 日志 / 渲染物）。
  - dev/bin
  - dev/configs
  # 发布态资源：渲染物（wist-gateway.toml / nginx.conf / *.value.json）+ 运行态（store / logs / knowledge）。
  - configs

# 现场态：升级/重建时**不覆盖、也不删**的路径（glob，相对系统根）。
#
# 不变式 `ignore ⊆ protect`：不进交付包的按定义就不是包内容，升级当然也不该碰它。
# 这里比 ignore 更大：`.env` / `packages` 没被 ignore（它们本来就不入库），但同样是现场态。
# `contract:`（下方）声明即**自动纳入保护**，不必在这里再写一遍。
protect:
  - .env
  - packages
  - data-plane-run
  - dev/bin
  - dev/configs
  - .wist
  - configs

# 对外契约：**不可重建的公开现场事实** —— 本栈把它定为**整个站点身份**（自足）。
#
# `identity/`（dev/prod 共用）里：
#   gateway/ —— `gateway-ca.{crt,key}.pem`（agent 信任锚；换锚 = 全队 agent 重装）、`agent-ca.*`
#               （给 agent 签客户端证书）、`admin-tls.*`（网关叶）、`install-script-signing-*.pkcs8.pem`、
#               `knowledge-signing.pub.pem`、`wist-gateway-pub.toml`（对外域名 / 归属）；
#   web/     —— `web-ca.*` / `web-tls.*`（前端站点证书）。
#
# **为什么含私钥**：身份是「证书 + 私钥」一对，**只留公开半不自足** —— 丢了私钥就签不出新的叶/客户端证书
# （= 换锚、全队 agent 重装），契约等于冻结/作废。故整目录进 contract，让 `contract export` 出来的
# 归档即可**独立复原站点身份**。
#
# 语义**自足**：命中即 **不覆盖（protect）+ 必收（backup）+ 不进包**，不必再写进上面三节。
# ⚠ 因为含私钥，`gops prj contract export` 的归档是**密件**：落点（`ops-prj.yml: contract.target`）
#   要放在**安全 / 离机**处，与整站备份同等级别对待。
# ⚠ 已知（gops 2.3.0）：`sys package` **尚未把 `contract` 计入排除**，故 `--full` 下 `identity/` 仍可能进包；
#   发布走 `.github` 的 `git archive` + `.gitignore`（含 `/identity/`），不受影响 —— 待 gops 修复后再靠 `--full`。
contract:
  - identity

# 备份选取（**扁平列表**只表达“丢了什么代价”，**不触发任何删除**）：
# 丢了要重装 / 换身份 → `gops prj backup` 收，`gops prj restore` 放回。
# 站点身份（`identity/`）已由上面的 `contract` **自动纳入备份**（取的是 `backup ∪ contract`），
# 这里**不要**再列一遍 —— 同一路径写两处会触发 `contract.overlap`（诊断当声明错误报出）。
backup:
  # 发布态资源整目录：渲染出的配置（wist-gateway.toml / nginx.conf / *.value.json）+ **store 库**
  # （agent 登记 / 已签凭据 —— 丢了 agent 要重建登记）+ logs + knowledge/initial。收整目录以便原样回放。
  - configs
  # 栈根现场密钥文件：admin token（`scripts/init-gateway.sh` 生成，**唯一一份、不可推导**）。
  # 丢了不是“要重装”，而是“口令被重新随机生成” ⇒ 恢复后所有用旧 token 的客户端（页面、
  # import-knowledge.sh / import-package.sh）全失效。与“还原能原样复原”是同一件事。
  - .wist
