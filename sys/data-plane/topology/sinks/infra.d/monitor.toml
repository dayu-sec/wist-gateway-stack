
[sink_group]
name = "monitor"
batch_size = 1
batch_timeout_ms = 300

[[sink_group.sinks]]
connect = "file_proto_text_sink"

[sink_group.sinks.params]
file = "monitor.dat"

[sink_group.sinks.expect]
max = 1.0

# 统计指标镜像到 VictoriaMetrics（endpoint 由 WPARSE_VM_ENDPOINT 环境变量注入）
[[sink_group.sinks]]
name = "metrics_vmetrics_sink"
connect = "victoriametrics_sink"
tags = ["sink:vmetrics"]

[sink_group.sinks.params]
endpoint = "${WPARSE_VM_ENDPOINT}"
