[package]
name = "wist-stackcheck"
version = "0.2.6" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
description = "Stack-level config checks for the wist gateway stack: profile + gateway-specific package/knowledge/prereq checks; engine is wist-stackcheck-core."
publish = false

[dependencies]
# 本地开发用 path；发布前切成共享仓的 git rev/tag（见 README）。
wist-stackcheck-core = { git = "https://github.com/dayu-sec/wist-stack-tools.git", tag = "v0.1.0" }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
