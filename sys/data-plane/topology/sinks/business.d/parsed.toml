[sink_group]
name = "gateway-logs"
oml = ["*"]
wp_meta_disable = ["wp_oml_name"]


[[sink_group.sinks]]
name = "gateway_file"
connect = "file_json_sink"
tags = []

[sink_group.sinks.params]
base = "./data/out_dat/"
file = "gateway.json"

