# Agent 原文发现快照（wist-agentd ` DSNAP:` 帧）独立 sink 分组。
#
# 与 agent-facts（事实摘要）分开：
#   - 摘要 10~30 KB，进网关控制面；
#   - 原文快照一台几百 KB，消费者是 wist-atlas，不进网关库。
#
# 当前只落文件用于联调与回放；接上 atlas 的内部 ingest 后，再在同一分组加一个
# http_sink（不要把快照投到 gateway_facts_sink）。
[sink_group]
name = "agent-discovery"
oml = ["agent_discovery_snapshot"]
tags = ["biz:agent-discovery"]
batch_size = 1
batch_timeout_ms = 300

[[sink_group.sinks]]
name = "json"
connect = "file_json_sink"
tags = ["sink:json"]

[sink_group.sinks.params]
file = "agent-discovery.jsonl"
