[package]
name = "wist-stackcheck"
version = "0.2.7" #@gxl:set(version)
edition = "2024"
license = "Apache-2.0"
description = "Stack-level config checks for the wist gateway stack: profile + gateway-specific package/knowledge/prereq checks; engine is wist-stackcheck-core."
publish = false

[dependencies]
# 本地开发用 path；发布前切成共享仓的 git rev/tag（见 README）。
# 共享引擎已发布到 crates.io（0.1.x）。
wist-stackcheck-core = "0.1"
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
