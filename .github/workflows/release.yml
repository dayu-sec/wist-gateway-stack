name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 打包：整仓内容（除 CI 自身的 .github）打成部署包。
  # 用 git archive 出包，只收 git 跟踪的内容 —— sysrun/bin/（约 92M 本地二进制）、
  # sysrun/data-plane/{data,.run}/、configs/、values/、_gal/.report 等都未入 git，天然不入包。
  # 例外：变量解析产物 —— 新版 `sys/merged_vars.yml`（gops 文档标注“需入库”）随 git archive
  # 进包；旧名 `sys/resolved_vars.yml` 是生成物，CI 里由 `gops sys update` 生成后兜底追加。
  # 注意：改了 sys/setting/vars.yml 后要本地跑 `gops sys update` 并提交 merged_vars.yml，
  # 否则包里带的是旧值。
  package:
    name: Package deployment bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # prj import 要求包内有 sys/resolved_vars.yml（gops sys update 的产物）。
      # 它是生成物、未入 git，所以 CI 里现算：拉 gops 二进制（galaxy-ops 是公开仓，
      # 有 linux 二进制 release）。pin 到 v1.2.0-alpha —— 已验证它的 sys update 产物与
      # 本地 1.3.0 逐字节一致；galaxy-ops 发新版后把 gops_tag 顶上去即可。
      - name: Install gops
        run: |
          set -eu
          gops_tag=v1.2.0-alpha
          curl -fsSL -o /tmp/gops.tgz \
            "https://github.com/galaxio-labs/galaxy-ops/releases/download/${gops_tag}/galaxy-ops-${gops_tag}-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p /tmp/gops-bin
          tar -xzf /tmp/gops.tgz -C /tmp/gops-bin
          echo "/tmp/gops-bin/artifacts" >> "$GITHUB_PATH"
          /tmp/gops-bin/artifacts/gops --version

      - name: Resolve system vars
        run: gops sys update

      - name: Build tarball
        run: |
          set -eu
          bundle="wist-gateway-stack-${GITHUB_REF_NAME}"
          # 注意：**不要**加 --prefix —— gops 解包时会自建同名目录（~/ds-package/<包名>/），
          # 包内再套一层会导致 prj import 找不到 sys/sys_model.yml。
          git archive \
            --format=tar \
            HEAD -- . ':(exclude).github' > "${bundle}.tar"
          # 变量解析产物：新版是 sys/merged_vars.yml（gops 文档标注“需入库”，已随 archive 进包）；
          # 旧名 sys/resolved_vars.yml 是生成物、未入 git，若存在且不在包里则兜底追加。
          for f in sys/merged_vars.yml sys/resolved_vars.yml; do
            if [ -f "$f" ] && ! tar -tf "${bundle}.tar" | grep -qx "$f"; then
              tar -rf "${bundle}.tar" "$f"
              echo "已追加: $f"
            fi
          done
          gzip -9 "${bundle}.tar"
          echo "包内关键文件："
          tar -tzf "${bundle}.tar.gz" | grep -E "sys/.*vars\.yml|sys/sys_model\.yml|docker-compose\.yml"
          ls -lh "${bundle}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: wist-gateway-stack
          path: wist-gateway-stack-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 发布到 GitHub Release，供中心作为版本制品下载。
  release:
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wist-gateway-stack
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz
