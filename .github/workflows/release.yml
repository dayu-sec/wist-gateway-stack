name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 栈级检查器（`tools/stackcheck`）的单元测试 + 三平台构建。
  # 二进制**打进同一个部署包**（运行时按 triple 选），所以发布仍是一个平台无关的单包。
  # 矩阵只覆盖会真实用到的架构；其他架构在运行时由 `scripts/check-stack.sh` 明确报错（不静默跳过）。
  stackcheck-test:
    name: Test stackcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path tools/stackcheck/Cargo.toml --locked

  stackcheck-build:
    name: Build stackcheck (${{ matrix.triple }})
    needs: [stackcheck-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04, triple: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04, triple: aarch64-unknown-linux-musl }
          - { os: macos-14,      triple: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross（linux-musl 交叉编译）
        if: contains(matrix.triple, 'linux-musl')
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        env:
          TRIPLE: ${{ matrix.triple }}
        run: |
          set -eu
          if [ "${TRIPLE#*linux-musl}" != "${TRIPLE}" ]; then
            cross build --release --locked \
              --manifest-path tools/stackcheck/Cargo.toml --target "${TRIPLE}"
          else
            cargo build --release --locked \
              --manifest-path tools/stackcheck/Cargo.toml --target "${TRIPLE}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: stackcheck-${{ matrix.triple }}
          path: tools/stackcheck/target/${{ matrix.triple }}/release/wist-stackcheck
          if-no-files-found: error
          retention-days: 7

  # 打包：整仓内容（除 CI 自身的 .github）打成部署包。
  # 用 git archive 出包，只收 git 跟踪的内容 —— dev/bin/（约 92M 本地二进制）、
  # data-plane/{data,.run}/、configs/ 与 identity/（现场生成，已 ignore）、values/、_gal/.report
  # 等都未入 git，天然不入包；sys/configs/web/nginx.conf.tpl 随仓入库，会进包。
  # 变量解析产物 sys/merged_vars.yml 是 gops 文档标注“需入库”的文件，已在仓库里、
  # 随 git archive 进包，所以这里不需要跑 gops。
  # 纪律：改了 sys/setting/vars.yml 后，本地跑一次 `gops sys update` 并把 merged_vars.yml
  # 的变更一起提交，否则包里带的是旧值。
  package:
    name: Package deployment bundle
    needs: [stackcheck-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # 预编译件按 triple 放进 bin/，再由下面的 `tar -rf` 追加进**同一个**包。
      - uses: actions/download-artifact@v8
        with:
          pattern: stackcheck-*
          path: staging

      - name: Stage stackcheck binaries
        run: |
          set -eu
          rm -rf stage
          for dir in staging/stackcheck-*; do
            [ -d "${dir}" ] || continue
            triple="${dir#staging/stackcheck-}"
            mkdir -p "stage/bin/${triple}"
            cp "${dir}/wist-stackcheck" "stage/bin/${triple}/wist-stackcheck"
            chmod 755 "stage/bin/${triple}/wist-stackcheck"
          done
          # 包内必须真的有三个平台：少一个就会让那部分现场无法体检。
          count=$(ls -1 stage/bin | wc -l | tr -d ' ')
          [ "${count}" -ge 3 ] || { echo "::error::stackcheck 只构建出 ${count} 个平台"; exit 1; }
          find stage -type f -exec ls -lh {} \;

      - name: Build tarball
        run: |
          set -eu
          bundle="wist-gateway-stack-${GITHUB_REF_NAME}"
          # 注意：**不要**加 --prefix —— gops 解包时会自建同名目录（~/ds-package/<包名>/），
          # 包内再套一层会导致 prj import 找不到 sys/sys_model.yml。
          # 变量文件 sys/merged_vars.yml 由仓库带上，不必在 CI 里现算。
          git archive \
            --format=tar \
            HEAD -- . ':(exclude).github' > "${bundle}.tar"
          # 预编译件不在 git 里（`git archive` 只收跟踪内容），在**未压缩**的 tar 上追加。
          # 这样制品仍是「一个平台无关的单包、同一个下载地址」，升级协议一行不用改。
          tar -rf "${bundle}.tar" -C stage bin
          gzip -9 "${bundle}.tar"
          echo "包内关键文件："
          tar -tzf "${bundle}.tar.gz" | grep -E "sys/.*vars\.yml|sys/sys_model\.yml|sys/docker-compose\.yml"
          echo "包内检查器："
          tar -tzf "${bundle}.tar.gz" | grep -E '^bin/.*/wist-stackcheck$'
          ls -lh "${bundle}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: wist-gateway-stack
          path: wist-gateway-stack-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 发布到 GitHub Release，供中心作为版本制品下载。
  release:
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wist-gateway-stack
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz

  # 可选：把本仓制品推到腾讯云 COS（对象存储），供中心 / CDN / 客户端按稳定 URL 拉取。
  # 未配置 Variables（COS_BUCKET 为空）时整段自动跳过，不会让发布失败；
  # 一旦设置 COS_BUCKET 即视为启用，此时密钥缺失会直接报错（便于发现漏配）。
  # 注意：`secrets` 上下文不能出现在 step 级 if 里，故启用判定放在 job 级（只看 vars）。
  #   Variables：COS_BUCKET（含 -APPID）、COS_REGION（如 ap-guangzhou）、可选 COS_PREFIX（默认取仓库名）
  #   Secrets：  COS_SECRET_ID、COS_SECRET_KEY（临时密钥再加 COS_SESSION_TOKEN）
  # 对象键：<COS_PREFIX>/<tag>/<文件名> 与 <COS_PREFIX>/latest/<文件名>
  # 每个对象带自定义元数据 x-cos-meta-artifact-sha256=<hex>（COS 只存 MD5 ETag，sha256 得自带）。
  upload-cos:
    name: Upload artifacts to Tencent COS
    needs: [release]
    runs-on: ubuntu-24.04
    if: ${{ vars.COS_BUCKET != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: pkg
          merge-multiple: true

      - name: Install coscli
        run: |
          set -eu
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/coscli" \
            https://github.com/tencentyun/coscli/releases/download/v1.0.9/coscli-v1.0.9-linux-amd64
          chmod +x "$HOME/.local/bin/coscli"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/coscli" --version

      - name: Upload to COS
        env:
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
          COS_PREFIX: ${{ vars.COS_PREFIX }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_SESSION_TOKEN: ${{ secrets.COS_SESSION_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # 去掉密钥里的空白字符：粘贴常带入尾随换行/空格，会让签名报 SecretKey is invalid。
          secret_id="$(printf '%s' "${COS_SECRET_ID}" | tr -d '[:space:]')"
          secret_key="$(printf '%s' "${COS_SECRET_KEY}" | tr -d '[:space:]')"
          session_token="$(printf '%s' "${COS_SESSION_TOKEN}" | tr -d '[:space:]')"
          # 明文写入 AK/SK，因此必须显式关掉 coscli 的密钥加密（disableencryption）。
          cat > "$HOME/.cos.yaml" <<EOF
          cos:
            base:
              protocol: https
              disableencryption: "true"
              secretid: "${secret_id}"
              secretkey: "${secret_key}"
              sessiontoken: "${session_token}"
            buckets:
              - name: "${COS_BUCKET}"
                alias: "${COS_BUCKET}"
                region: "${COS_REGION}"
                endpoint: "cos.${COS_REGION}.myqcloud.com"
          EOF
          prefix="${COS_PREFIX:-${GITHUB_REPOSITORY##*/}}"
          prefix="${prefix%/}"
          cfg="$HOME/.cos.yaml"
          out="$PWD/coscli_output"
          rm -rf "${out}"
          # coscli 只打印汇总，失败明细落在 coscli_output/<时间>/ 下；失败时打印并输出为 annotation。
          dump_err() {
            echo "::error::$1"
            if [ -d "${out}" ]; then
              find "${out}" -type f -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
              detail="$(find "${out}" -type f -exec cat {} \; | tr '\n' ' ' | sed -e 's/%/%25/g' | cut -c1-1500)"
              echo "::error title=coscli 明细::$1 —— ${detail}"
            fi
            exit 1
          }
          shopt -s nullglob
          files=(pkg/*)
          [ ${#files[@]} -gt 0 ] || { echo "::error::pkg/ 下没有制品可上传"; exit 1; }
          for f in "${files[@]}"; do
            [ -f "${f}" ] || continue
            name="$(basename "${f}")"
            # COS 对象只存 MD5（ETag），GitHub 侧资产 digest（sha256）过不来。把 sha256 作为
            # **对象自定义元数据**写进对象本身（x-cos-meta-artifact-sha256 —— 与设计里的
            # artifact_sha256 字段同名）—— 随对象走，录 COS 地址时可用 `coscli stat`（HEAD）
            # 读回填 expected_sha256（`ls` 不返回自定义元数据）。--meta 形如 key:value（多个用 # 分隔）。
            # 本 step 只有 `set -eu`（无 pipefail），管道失败会被 cut 吃掉；空摘要等于又「丢」了，
            # 故显式兜一道。
            sha="$(sha256sum "${f}" | cut -d' ' -f1)"
            [ -n "${sha}" ] || { echo "::error::无法计算 ${name} 的 sha256" >&2; exit 1; }
            meta="x-cos-meta-artifact-sha256:${sha}"
            coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/${TAG}/${name}" -c "${cfg}" --meta "${meta}" \
              || dump_err "上传 ${name} 失败（${TAG}）"
            coscli cp "${f}" "cos://${COS_BUCKET}/${prefix}/latest/${name}" -c "${cfg}" --meta "${meta}" \
              || dump_err "上传 ${name} 失败（latest）"
            echo "已上传 ${name}  sha256=${sha}"
          done
          echo "COS 上传完成。"
          coscli ls "cos://${COS_BUCKET}/${prefix}/" -c "${cfg}" \
            || echo "::warning::COS 列表失败（可能缺 cos:GetBucket 权限）；上传本身已成功。"
