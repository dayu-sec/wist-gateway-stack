version = "1.0"
robust = "normal"
skip_parse = false
skip_sink = false
gen_event_md5 = false

[models]
wpl = "./models/wpl"
oml = "./models/oml"
knowledge = "./models/knowledge"

[topology]
sources = "./topology/sources"
sinks = "./topology/sinks"

[performance]
rate_limit_rps = 0
parse_workers = 2
reload_timeout_ms = 10000
fetch_timeout_ms = 300

[rescue]
path = "./data/rescue"

[log_conf]
level = "warn,ctrl=info,data=error,matrc=error,dfx=warn,kdb=warn"
output = "File"

[log_conf.file]
path = "./data/logs/"

[[stat.pick]]
key = "pick_stat"
target = "*"

[[stat.parse]]
key = "parse_stat"
target = "*"

[[stat.sink]]
key = "sink_stat"
target = "*"

[semantic]
enabled = false

[project_remote]
# 规则/配置从 Center Git Proxy 拉取（Gateway 不持有 CNB 凭据）。
# 容器启动时把 data-plane/ 作为只读种子复制到 data-plane-run/work，本段会写工作根。
enabled = true
repo = ""
init_version = ""

[project_remote.models]
# 由 Gateway 容器环境注入（Gateway 主机视角的 Center Git Proxy 地址）。
repo = "${WPARSE_PROJECT_MODELS_REPO}"
init_version = ""

[project_remote.infra]
repo = "${WPARSE_PROJECT_INFRA_REPO}"
init_version = ""

# [admin_api] 不在这里：infra 同步会**整体替换** conf/，把远程控制端口重置成远端模板值。
# 管理面配置见项目根目录的 wparse.local.toml（wparse >= 0.32.0 优先读取它）。
