# wist-gateway-stack — 网关控制台 + 数据平台(WarpParse) + 观测 一站式编排
#
# 端口约定（宿主:容器；宿主端口的值见 sys/setting/vars.yml，客户在 values/value.yml 覆盖）：
#   gateway          ${GATEWAY_PORT}:3000    控制面后端（HTTPS；默认 443 —— 也是 agentd 直连的入口）
#   web              ${WEB_PORT}:443         前端入口（静态托管 + /api 反代；默认 8443）
#   victoria-metrics ${VM_PORT}:8428         指标（默认 18429）
#   wparse           ${WPARSE_PORT}:9000     数据面入口（agent 上送，明文 TCP；默认 9000）
#
# 容器内端口是**应用契约**，写死（3000/443/8428/9000）；宿主端口才是变量 —— 两边不要写混。
#
# 值来源（gops 系统约定）：
#   - 随环境/客户变化的量（镜像源与 tag、宿主端口、保留期、时区、挂载路径）统一用
#     Compose 原生 `${VAR}` 占位，定义在 sys/setting/vars.yml；
#     `gops sys update` → sys/resolved_vars.yml，`gops sys localize` → 同目录 .env。
#     客户覆盖写 values/value.yml（该文件版本化），不要改生成物。
#   - 容器内端口/路径/服务名是应用契约，直接写在这里。
#   - 网关的 admin token 走密钥文件（栈根 `.wist/sec-value.yml`，只读挂进网关容器）；
#     其它密钥如需，仍可用 `${SEC_xxx}` 占位、由 `gops run start` 注入、不落盘。

# 运行身份（与宿主侧权限的对接口径；容器身份以这里的 `user:` 为准，`gops sys perms` 直接读它）：
#   两个业务镜像都**固定以 999:999 运行**（gateway 镜像里的 wist、wparse 镜像里的 wparse）。
#   这里**显式钉死**而不是依赖镜像声明的用户：将来镜像重建换了 uid，宿主侧按 999 对齐的目录
#   就会对不上，而症状只是「容器无限重启」——不如让它成为一处显式契约。
#   bind 挂载在 Linux 上**不改变属主**，所以宿主侧必须用 `gops sys perms`（gops ≥ 2.7，本栈硬要求）
#   对齐：属主=部署账号、属组=999、读写挂载 0660/2770(setgid)、只读挂载 0640/2750。
#   它从 compose 派生（服务 `user:` + `volumes.read_only`），**新增挂载只需在 compose 里声明**，
#   不需要改任何名单。注意 `docker compose up` 会自行把**缺失**的挂载源建成 root:root，
#   所以对齐必须在 up 之前（`gops sys localize` 的阶段流程会自动跑）。
#
# 单实例保障（发布态这一半）：**一个操作系统上只允许跑一套本栈**。
#
# 三个服务都钉了**固定 `container_name`**（不是 compose 默认的 `<项目>-<服务>-1`）。
# 为什么必须钉：默认名里带**项目名**，而项目名默认取目录名 —— 两份同名目录的栈会共用同一批
# 容器名，第二个 `up` 不会报错，而是**悄悄接管/顶掉**第一个的容器（“停了却还在跑”就是这么来的）。
# 钉死之后，第二个栈的 `up` 会在创建时就**当场报名字冲突**。名字写成字面量、不走变量，是故意的：
# 可配的名字等于没有保证。
#
# 边界：这一层只能挡“同宿主上的第二套 compose”，挡不住手工 `docker run` 的野实例，
# 也管不到容器内的进程（网关自己的 `flock` 锁在容器里是独立的一把，见
# `wist-gateway/src/infra/single_instance.rs` 与下面 wparse 那段的同一思路）。

services:
  # ── 观测：指标 ──
  victoria-metrics:
    container_name: wist-gateway-stack-vm
#    image: victoriametrics/victoria-metrics:${VM_TAG}
    image: ${VM_SPC}/victoria-metrics:${VM_TAG}
    restart: unless-stopped
    ports:
      - "${VM_PORT}:8428"
    volumes:
      - metrics_data:/storage
    command:
      - --envflag.enable
      - --envflag.prefix=VM_
      - --loggerFormat=json
      - --retentionPeriod=${RETENTION_PERIOD}
      - --storageDataPath=/storage
      - --search.latencyOffset=0s
    environment:
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8428/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── 数据平台：WarpParse（ELT 引擎）──
  # WPARSE_IMAGE 来自上游镜像仓库，客户可用 values/value.yml 覆盖成内网镜像仓库。
  # 挂载约定（镜像里 /data 属非 root 用户 wparse(uid 999)）：
  #   - 配置从 sys/data-plane/（只读种子）复制到 data-plane-run/work（可写运行根）：
  #     `[project_remote]` 会把 Git 内容写进工作根，所以不能直接只读挂载当工作根。
  #   - 运行态直接挂到 /data 下的两个子路径：/data/data（输出）与 /data/.run（引擎状态）。
  # 关键：**不挂 /data 这一整根**。把运行目录挂成 /data（父挂载）、配置再嵌进去，会让 Docker
  # 在宿主运行目录里建出一堆空白挂载点目录；改成直接挂 /data/data 与 /data/.run 后，所有
  # 挂载点都建在容器层里，宿主运行目录保持干净。
  # 运行态用**宿主目录 bind 挂载**（不是命名卷）：属主/权限由 `gops sys perms` 对齐
  # （属主=部署账号、属组=999、2770 setgid）——不靠「目录是谁创建的」。
  #
  # 管理面（WarpStation 发布链路）：容器内 0.0.0.0:19090 + TLS；宿主**只发布 127.0.0.1**，
  # 由本机 gwlinkd 调用。证书复用 identity/gateway 的 admin-tls。
  # token 权限：WarpParse 要求 token 文件 **0600 且属主为运行用户**；而 `gops sys perms` 会把
  # bind 挂载里的文件统一成 0660。因此把 `/data/.run` 改成**命名卷**（不受 perms 管理），
  # 由 wparse-run-init 在容器内以 999 身份从宿主 `.run/admin_api.token.host` 复制并 chmod 600；
  # 宿主那份 `.host` 留给 gwlinkd 读（属主=部署账号）。
  #
  # 单实例保障：引擎自身**没有**单实例保护（同名 work root 起两个会互写 .run/ 与输出），
  # 所以 entrypoint 先用 flock 独占 /data/.run/.wparse.lock（落在命名卷内）再把引擎交给 PID 1：
  #   -F（不 fork）→ wparse 自己就是 PID 1，docker stop 的 SIGTERM 直达引擎、能优雅退出；
  #   -n → 拿不到锁立即失败（不排队），避免“默默等锁”看不出配错了；
  #   --verbose + -E 75 → 失败时日志打 `flock: failed to get lock`、容器以 75 退出。
  # 开发态脚本（dev/svc.sh）用同一把锁，所以容器与宿主也不会同时跑。
  # 这层包装是绕过：引擎自身应当持锁 —— 已提上游 wp-labs/warp-parse#365，
  # 上游实现后这里的 entrypoint 可以直接去掉。
  wparse-run-init:
    container_name: wist-gateway-stack-wparse-run-init
    image: ${WARP_SPC}/warp-parse:${WPARSE_TAG}
    user: "999:999"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # 首次：把宿主旧 .run/ 作为种子复制进命名卷（存在不覆盖）。
        if [ -z "$$(ls -A /run 2>/dev/null)" ]; then
          cp -a /seed/. /run/ 2>/dev/null || true
        fi
        # WarpParse 要求 token 0600 且属主=运行用户；这里在卷内重建一份。
        [ -s /seed/admin_api.token.host ] || {
          echo "missing /seed/admin_api.token.host; run gops sys localize" >&2
          exit 1
        }
        cp -f /seed/admin_api.token.host /run/admin_api.token
        chmod 600 /run/admin_api.token
        echo "wparse run volume ready: /run/admin_api.token (0600)"
    volumes:
      - wparse-run:/run
      - ${WPARSE_RUN_STATE}:/seed:ro

  wparse:
    container_name: wist-gateway-stack-wparse
    image: ${WARP_SPC}/warp-parse:${WPARSE_TAG}
    # 运行身份显式钉死（镜像里是 wparse）；宿主侧按同一 gid 对齐权限，见文件头「运行身份」
    user: "999:999"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /data/data /data/.run
        # 只读种子 → 可写工作根：只补缺失，不覆盖现场（项目远端会更新工作根）。
        for d in conf connectors models topology; do
          mkdir -p "/data/$$d"
          cp -an "/seed/$$d/." "/data/$$d/"
        done
        # 站点本地覆盖层（[admin_api]）：位于 conf/ 之外，project_remote 不会替换；缺失才补。
        if [ -f /seed/wparse.local.toml ]; then
          cp -an /seed/wparse.local.toml /data/wparse.local.toml
        fi
        exec /usr/bin/flock --verbose -n -E 75 -F /data/.run/.wparse.lock \
          /usr/local/bin/wparse daemon --work-root /data
    environment:
      WPARSE_VM_ENDPOINT: http://victoria-metrics:8428
      # 数据面 sink（agent-facts / agent-logs）用的网关内部接入端点；
      # 与网关配置的 [ingest].listen_addr 对应（明文 HTTP，只走 compose 内网）。
      WPARSE_GATEWAY_ENDPOINT: http://gateway:3001
      # project_remote 的两个仓库（Center Git Proxy，Gateway 不持有 CNB 凭据）。
      WPARSE_PROJECT_MODELS_REPO: ${WPARSE_PROJECT_MODELS_REPO}
      WPARSE_PROJECT_INFRA_REPO: ${WPARSE_PROJECT_INFRA_REPO}
      # 信任 Center CA（Git Proxy 的 TLS 证书由中心 CA 签发）。
      GIT_SSL_CAINFO: /data/identity/control-center.pem
      SSL_CERT_FILE: /data/identity/control-center.pem
    volumes:
      # 配置种子（唯一源，只读）
      - ${WPARSE_WORK_DIR}:/seed:ro
      # 可写运行根（配置 + project_remote 同步内容）
      - ${WPARSE_RUN_WORK}:/data
      # 运行态：命名卷（token 需要 0600，不能跟 perms 管理的 bind 文件混在一起）
      - wparse-run:/data/.run
      # 输出目录继续用宿主 bind（便于现场查看/备份）
      - ${WPARSE_RUN_DATA}:/data/data
      # 管理面 TLS（复用网关 admin-tls）与 Center CA
      - ./identity/gateway/public/admin-tls.crt.pem:/data/identity/admin-tls.crt.pem:ro
      - ./identity/gateway/private/admin-tls.key.pem:/data/identity/admin-tls.key.pem:ro
      - ./identity/gwlinkd/control-center.pem:/data/identity/control-center.pem:ro
    ports:
      # agent 数据面入口（wparse source tcp_1）。明文，需对 agent 可达；
      # 管控面 agent 上送地址由网关下发（/api/v1/admin/agent/uplink），要与这里一致。
      - "${WPARSE_PORT}:9000"
      # 管理面只发布回环：gwlinkd 是本机宿主进程；**不要**写成 0.0.0.0。
      - "127.0.0.1:${WPARSE_ADMIN_PORT}:19090"
    extra_hosts:
      # 单机部署：Center 域名在宿主 /etc/hosts 指向 127.0.0.1，容器通过 DNS 继承后
      # 会把 Center Git Proxy 解析成容器自己���git clone 失败）。这里改指宿主网关。
      # CENTER_DOMAIN 为空时映射一个无效占位名，不影响真实 DNS 部署。
      - "${CENTER_DOMAIN:-center.invalid}:host-gateway"
    depends_on:
      victoria-metrics:
        condition: service_healthy
      wparse-run-init:
        condition: service_completed_successfully

  # ── 控制面后端 ──
  gateway:
    container_name: wist-gateway-stack-gateway
    # 本地零配置联调可换成 bootstrap 镜像（image 改成 wist-gateway:bootstrap）
    image: ${WIST_SPC}/wist-gateway:${GATEWAY_TAG}
    # 运行身份显式钉死（镜像里是 wist）；宿主侧按同一 gid 对齐权限，见文件头「运行身份」
    user: "999:999"
    restart: unless-stopped
    environment:
      WIST_GATEWAY_CONFIG: /config/wist-gateway.toml
      # 管理 token 从密钥文件读（不落配置）：文件里的 `admin_token` → `${SEC_ADMIN_TOKEN}`。
      WIST_GATEWAY_SEC_FILE: /secrets/sec-value.yml
      # 接口层（现场态，dev/prod 共用）：对外基址 / 归属。不在主配置旁，故显式指定。
      WIST_GATEWAY_PUB_CONFIG: /config/identity/public/wist-gateway-pub.toml
      # 全栈版本（页面左下角展示）：直接读挂进来的 `version.txt`，不在环境里复制一份版本号。
      WIST_GATEWAY_STACK_VERSION_FILE: /config/stack-version.txt
    volumes:
      # 配置**按语义拆开挂**，而不是整目录 rw 挂到 /config：
      #   · 只读：wist-gateway.toml（含渲染值）、knowledge/（启动期知识源）
      #   · 读写：state/（store 库 / agent 日志 / 安装包与知识库副本）、logs/（进程日志与轮转）
      # 这样 compose 本身就把「哪些要写、哪些只读」声明清楚了：
      # `gops sys perms` 能精确对齐成 0640/2770，而不会把配置/知识库也放宽成可写。
      # 注意：`wist-gateway.toml` 是**文件**挂载，必须由 localize 先生成；
      # 缺文件时 Docker 会把它建成同名**目录**（下一次 gx.tpl 渲染会失败，删掉目录重跑即可）。
      - ${GATEWAY_CONFIG_DIR}/wist-gateway.toml:/config/wist-gateway.toml:ro
      # 全栈版本（展示用）：`version.txt` 是唯一真值，只读挂进容器；
      # 镜像只是通道，不在镜像/环境变量里复制版本号。
      - ./version.txt:/config/stack-version.txt:ro
      - ${GATEWAY_CONFIG_DIR}/knowledge:/config/knowledge:ro
      - ${GATEWAY_CONFIG_DIR}/state:/config/state
      - ${GATEWAY_CONFIG_DIR}/logs:/config/logs
      # 站点身份（dev/prod 共用，只读）：证书 / 私钥 / 信任锚 / 签名密钥 / 对外配置。
      # 从资源树拆出（见 sys-prj.yml 的 contract / backup）—— 不可重建，不该跟渲染物一起被升级覆盖。
      - ./identity/gateway:/config/identity:ro
      # 密钥目录（只读）：网关用 WIST_GATEWAY_SEC_FILE 读里面的 `sec-value.yml` 解析 `${SEC_...}`。
      # 挂**目录**而非文件：源缺失时 Docker 只是建出 `.wist/` 目录（本就 gitignore），
      # 不会把 `sec-value.yml` 建成同名目录让报错变得难懂。文件由 scripts/init-gateway.sh 生成。
      - ./.wist:/secrets:ro
      # 安装包投放目录（只读）：界面「本地来源」填 /packages/<文件名>。
      # 容器读不到宿主任意路径，本地包必须先落到这个被挂进来的目录。
      - ${PACKAGE_DIR}:/packages:ro
    ports:
      - "${GATEWAY_PORT}:3000"
    depends_on:
      victoria-metrics:
        condition: service_healthy

  # ── 前端 ──
  web:
    container_name: wist-gateway-stack-web
    image: ${WIST_SPC}/wist-gateway-web:${WEB_TAG}
    restart: unless-stopped
    volumes:
      - ${WEB_NGINX_CONF}:/etc/nginx/conf.d/default.conf:ro
      # 站点身份（dev/prod 共用，只读）：前端公开证书在 /certs/public、私钥在 /certs/private。
      - ./identity/web:/certs:ro
    ports:
      - "${WEB_PORT}:443"
    depends_on:
      - gateway

volumes:
  metrics_data:
    driver: local
  # wparse 运行态（含 0600 admin token 与引擎状态）。命名卷不受 `gops sys perms` 管理，
  # 由 wparse-run-init 在容器内保持 999:999 / 目录 2770 / token 0600。
  wparse-run:
    name: wist-gateway-stack-wparse-run
    driver: local
