# 裸 syslog TCP 入口（设备/中间件直接发 RFC3164/5424，不带 Wist Agent 信封）。
# 与 UDP 入口（syslog_udp_1）**同端口、同语义**：两侧的 header_mode 必须都是 keep。
# 连接器默认 skip 会剥掉 RFC5424 头，裸 syslog 规则（wp-rules，如 chaitin_safeline 的
# `_:pri<<,>>`）就匹配不上，整条包会掉进 miss/raw。只要有一边是 skip，
# 同一条报文换个传输就会「一个能解析、一个不能」，现场会误判成端口冲突。
key = "syslog_tcp_1"
enable = true
connect = "syslog_tcp_src"
tags = []

[params]
addr = "0.0.0.0"
port = 1514
protocol = "tcp"
header_mode = "keep"
