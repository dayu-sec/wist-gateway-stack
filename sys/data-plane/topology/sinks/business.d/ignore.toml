[sink_group]
name = "ignore"
# 按**后缀**收：`kernel_system_host/ignore`（现值）+ `container_workload/ignore`（wp-rules 拆出容器忽略规则后）。
# 钉死目录前缀会被上游改名打断（`host/*` → `kernel_system_host/*` 已踩过一次），所以写通配。
oml = ["*/ignore"]

[[sink_group.sinks]]
name = "ignore-file"
connect = "file_json_sink"
[sink_group.sinks.params]
base = "./data/out_dat"
file = "ignore.json"
max_size = "100MB"
max_rolls = 1
roll_compress = "gzip"
