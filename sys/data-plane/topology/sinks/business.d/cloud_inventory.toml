# 云账号资产快照（wist-harvest）独立 sink 分组：消费者是 atlas，不进网关库。
#
# 必须绑 cloud_inventory 的 OML；绑错/漏绑的后果与 agent-dsnap 相同：
# 记录落进兜底 sink 或被网关日志接入点拒收。
#
# 当前只落文件用于联调与回放；接上 atlas 的内部 ingest 后，在**同一分组**再加一个
# http_sink（不要投到 gateway_facts_sink / gateway_logs_sink）。
[sink_group]
name = "cloud-inventory"
oml = ["cloud_inventory_obs_snapshot"]
tags = ["biz:cloud-inventory"]
batch_size = 1
batch_timeout_ms = 300

[[sink_group.sinks]]
name = "json-file"
connect = "file_json_sink"
tags = ["sink:json"]

[sink_group.sinks.params]
file = "cloud-inventory.jsonl"
max_size = "100MB"
max_rolls = 1
roll_compress = "gzip"
