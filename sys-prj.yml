test_envs:
  dep_root: ''
  deps: []

# `gops sys package` 打包时排除的路径（glob，相对系统根；默认模式与 `--full` **都生效**）。
#
# 为什么必须有这条：`--full` 是 `WalkDir` 整目录（只跳 `.git/`），而 `configs/` 里是**现场生成的身份材料**
# —— `state/` 下有 CA 私钥、TLS 私钥、安装脚本签名私钥与 store 库（见 .gitignore 的说明）。不加这条，
# 一次 `gops sys package --full` 就会把整套私钥塞进交付包。默认模式本来就只收 git 入库文件，这里是护栏。
#
# 身份/内容要跟着交付走，走的是它们自己的通路，不是系统包：
#   身份：scripts/backup-gateway.sh / restore-gateway.sh
#   内容：KNOWLEDGE_PKG_URL（或现场投放 configs/gateway/knowledge/initial/）
ignore:
  - configs
  # wparse 运行态根（WPARSE_RUN_DATA / WPARSE_RUN_STATE）：pid / 锁 / 引擎自带的 sqlite 与输出。
  # 那是**现场跑出来的**东西，随交付包发出去既无意义，还可能把上一台的运行态带进新环境。
  - data-plane-run
  # 开发态脚本用的本地二进制（dev/bin/，~92M，随平台而异）：现场自己装/自己编，不进交付包。
  - dev/bin

# 现场态：升级/重建时**不覆盖、也不删**的路径（glob，相对系统根）。
#
# 不变式 `ignore ⊆ preserve`：不进交付包的按定义就不是包内容，升级当然也不该碰它。
# 这里比 ignore 更大：`.env` / `packages` 没被 ignore（它们本来就不入库），但同样是现场态。
# 由 `gops prj diagnose` 校这不一致。
preserve:
  - .env
  - configs
  - packages
  - data-plane-run
  - dev/bin

# 备份选取分级（只表达“丢了什么代价”，**不触发任何删除**）：
#   restore 档：丢了要重装 / 换身份 → `gops prj backup` 默认收，`gops prj restore` 放回。
#   rebuild 档：可重建 → 默认不收，`--include-rebuild` 才收（价值只是省一次重投）。
# 不在两档里的 = 不收、不碰（如 `configs/gateway/state/logs/` 的运行日志）。
backup:
  restore:
    - configs/gateway/state/*.pem
    - configs/gateway/state/wist-gateway-store.db*
    - configs/gateway/wist-gateway.toml
    - configs/gateway/wist-gateway.value.json
    - configs/web/tls
  rebuild:
    - packages
