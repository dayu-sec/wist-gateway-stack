# 系统级变量定义（system 段，仅非密钥配置）—— **产品默认值**
#
# ⚠ 现场值不要写在这里：写 `values/value.yml`（它覆盖本文件，`gops sys localize` 即生效）。
#    改**本文件**才需要 `gops sys update`（并把 `sys/merged_vars.yml` 一起提交），否则不生效。
#
# 链路：本文件 → `gops sys update` → `sys/merged_vars.yml`（入库）
#       → `gops sys localize`（+ 合并 values/ 覆盖）→ 栈根 `.env` + `sys/configs/*.tpl` 渲染结果，
#       供 `sys/docker-compose.yml` 与网关/前端消费。
#
# 说明：
#   - 只有 `system:` 段的变量会进入 resolved_vars.yml 并最终导出到 .env；
#   - 密钥不要写在这里：网关 admin token 走密钥文件（栈根 `.wist/sec-value.yml`）；
#     其它密钥如需，compose 里用 ${SEC_xxx} 占位，运行时由 `gops run start`
#     从 ~/.galaxy/sec_value.yml 注入，不落盘；
#   - 容器内端口/路径/服务名是应用契约，直接写在 sys/docker-compose.yml 里。
system:
  # 镜像源前缀：国内走腾讯云 TCR，境外改成 ghcr.io/dayu-sec
  - name: IMAGE_SPC
    value: ghcr.io/dayu-sec

  # 镜像 tag：网关与前端各自独立发版，tag 分开；需要钉版本时改这里
  - name: GATEWAY_TAG
    value: v0.9.1-alpha
  - name: WEB_TAG
    value: v0.6.0-alpha
  # 观测镜像：直接用上游官方 victoriametrics/victoria-metrics（compose 里 image 就是它）
  - name: VM_TAG
    value: v1.153.0
  # wparse 镜像仓库与 tag：来自上游（无 TCR 镜像），内网/客户环境拉不到 ghcr.io 时
  # 把 WPARSE_IMAGE 指向内网镜像仓库（同步同版本镜像过去），tag 不变。
  - name: WPARSE_IMAGE
    value: ghcr.io/wp-labs/warp-parse
  # wparse 版本与 data-plane 工程强耦合（conf/connectors/models/topology 随引擎版本变），
  # 不能跟 latest：必须与 data-plane/ 当前配套的版本一起升（上游 tag 无 v 前缀，同版本
  # 的 latest 与 <version> 指向同一个 digest）。
  - name: WPARSE_TAG
    value: 0.27.1-alpha

  # 宿主端口（容器内端口是应用契约，写在 compose 里）
  - name: GATEWAY_PORT
    value: 443
  - name: WEB_PORT
    value: 8443
  - name: VM_PORT
    value: 18429
  # 网关查询观测后端（VictoriaMetrics）的地址：**随运行形态变**。
  #   发布态网关是 compose 容器 —— 走服务名 http://victoria-metrics:8428（默认值）；
  #   开发态网关是宿主进程（dev/svc.sh）—— 解析不到服务名，改成宿主可达地址（http://127.0.0.1:18429），
  #   否则「数据采集」页会 502（failed to query pipeline metrics）。
  - name: VICTORIA_METRICS_URL
    value: http://victoria-metrics:8428
  # 数据面入口端口：agentd 往这台上送日志/遥测（容器内是 wparse 的 source tcp_1:9000）
  - name: WPARSE_PORT
    value: 9000

  # 指标保留期（月）与时区
  - name: RETENTION_PERIOD
    value: 6
  - name: TZ
    value: Asia/Shanghai

  # 对外域名（前端站点证书的 SAN，也是网关 public_base_url 的 host）
  # —— 只是**默认值**；现场值走 values/value.yml（改那里 localize 即生效）
  - name: WEB_DOMAIN
    value: gw.example.com

  # 挂载源路径（按部署环境摆放）
  - name: GATEWAY_CONFIG_DIR
    value: ./configs/gateway
  # 前端站点配置：由 sys/configs/web/nginx.conf.tpl 在 localize 时渲染到此（运行物，不入库）
  - name: WEB_NGINX_CONF
    value: ./configs/web/nginx.conf
  # 站点身份（dev/prod 共用，不入库）：证书/私钥在 ./identity/{gateway,web}/{public,private}；
  # 由 compose 直接以字面量挂载（不在变量里——位置固定在栈根，不随部署环境变）。
  # wparse 工程：配置的**唯一源**（conf/connectors/models/topology），开发态与发布态共用
  - name: WPARSE_WORK_DIR
    value: ./data-plane
  # wparse 运行态：拆成两个子目录，分别挂到容器的 /data/data 与 /data/.run。
  #   为什么不挂 /data 这一整根：父挂载 + 配置子挂载会让 Docker 在宿主运行目录里
  #   建出一堆空白挂载点目录；直接挂到 /data 下的两个子路径就没有这个问题。
  #   data/：输出（logs / out_dat / in_dat / rescue）
  #   .run/：引擎状态（pid / authority.sqlite / rule_mapping.dat）
  # 与开发态的 data-plane/{data,.run} 分开，避免两个引擎同写一份运行态。
  # 注意：Linux 上这两个目录必须对容器用户（uid 999 = wparse）可写 —— **不要手工 chown**，
  # 由 scripts/align-host-perms.sh 统一对齐（属主=部署账号、属组=999、2770 setgid；localize 会自动跑）。
  - name: WPARSE_RUN_DATA
    value: ./data-plane-run/data
  - name: WPARSE_RUN_STATE
    value: ./data-plane-run/.run

  # 安装包投放目录（宿主），只读挂到网关容器的 /packages；界面「本地来源」填 /packages/<文件名>
  - name: PACKAGE_DIR
    value: ./packages

  # 发布 ②「Agent 包交付」：上面那份投放目录在**网关容器里**的路径（发给网关的 package_url 前缀，
  # 与 compose 的 `- ${PACKAGE_DIR}:/packages:ro` 一致）。gwlinkd 取到中心包后落到 PACKAGE_DIR，
  # 再把 `<此项>/<文件名>` 交给网关托管。
  - name: GWLINKD_AGENT_PACKAGE_CONTAINER_DIR
    value: /packages

  # 初始知识库内容包（出厂自带）：`gops sys localize` 时用 gx.download 拉到 PACKAGE_DIR（packages/），
  # 网关「知识库」页的「本地来源」填 /packages/<文件名> 即可录入（录入 ≠ 生效，还要点激活）。
  #   - 置空 = 跳过这一步（离线 / 不需要初始包；把包手工放进 packages/ 效果相同）
  #   - 内网 / 镜像源：在 values/value.yml 覆盖成可达地址
  #   - URL 带版本、文件名随版本变：升版本不会复用上一版的包（gx.download 按文件名判重）
  #   - 包本身的完整性由网关把关（manifest.json 摘要 + 配了验签公钥就验签），下载只保证不残缺
  - name: KNOWLEDGE_PKG_URL
    value: https://github.com/dayu-sec/wist-knowledge/releases/download/v0.1.4/wist-knowledge-0.1.4.tar.gz

  # ── gwlinkd（网关**宿主侧**常驻）接入上级控制中心的配置 ──
  #    **分两份**（与网关的 impl/pub 同口径）：
  #      · 主配置 `configs/gwlinkd/gwlinkd.toml`（交付物）——由 sys/configs/gwlinkd/gwlinkd.toml.tpl
  #        在 localize 时渲染（运行物，不入库）；渲染值由 scripts/init-gwlinkd.sh 写。
  #        只放随部署环境渲染的项；升级 / 重渲该被覆盖。
  #      · 现场态（永不重渲）——**声明 + 值分开**：
  #        声明 `identity/gwlinkd/gwlinkd-pub.toml`（只写 `${VAR}` 引用，由 tpl 机制渲染）；
  #        值   `identity/gwlinkd/.env`（scripts/init-gwlinkd-pub.sh 按缺补齐；下方
  #        CENTER_ENDPOINT / GWLINKD_GATEWAY_ID / GWLINKD_TRUST_BUNDLE 就是它的输入 ——
  #        **脚本只写这个值文件，不动声明 toml**）。
  #        落在 identity/ 之下 ⇒ 随 contract 一起不进包 / 必进备份。
  #    一次性接入券 `link_token` 不在渲染值里：由「链接上级」页触发、gwlinkd 临时写进 `.env`，
  #    **接入成功后自行删除**。
  #    center 端点默认空：现场在 values/value.yml 覆盖后跑 `gops sys localize` 即生效。
  - name: CENTER_ENDPOINT
    value: ""
  - name: GWLINKD_GATEWAY_ID
    value: gw-local
  # 中心 CA-S 信任锚路径（自签中心必需；公网中心可置空 → gwlinkd 回落系统根）。
  # 它是**现场事实**：与客户端证书同处身份目录（identity/），不在 configs/ 资源树里。
  - name: GWLINKD_TRUST_BUNDLE
    value: ./identity/gwlinkd/control-center.pem
  # gwlinkd **运行态**目录：单实例锁 / 升级簿记 / 待消费注册券 —— 可删可重建，**不是**身份材料。
  - name: GWLINKD_STATE_DIR
    value: ./configs/gwlinkd/state
  # gwlinkd **身份目录**：客户端证书 + 私钥（`credential.json`）与中心信任锚。
  # 不可再生（丢了只能换 gateway_id）⇒ 进 sys-prj.yml 的 `contract`（identity/），不进交付包。
  # 空 = 不渲染该项（gwlinkd 回落 state_dir，行为与旧版一致）。
  - name: GWLINKD_IDENTITY_DIR
    value: ./identity/gwlinkd
  # 本机网关环回面（页面路才需要；空 = 不渲染该项）
  - name: GATEWAY_SELF_ENDPOINT
    value: ""
  # 环回面信任锚（网关自签 HTTPS 必需；空 = 不渲染该项，用系统根）
  - name: GATEWAY_SELF_CA
    value: ""
  # gwlinkd 的升级执行器（空 = 不渲染该项，用 gwlinkd 内置缺省 `gops`）
  - name: GWLINKD_UPGRADER_PROGRAM
    value: ""
  # gops 工程根（含 ops-prj.yml）：gwlinkd 用 gops 执行器升级时**必配**（gops 从 cwd 解析工程）。
  # 空 = 不渲染该项（不驱动 gops 升级，收到升级计划会明确报缺配）。
  # **用绝对路径**：gwlinkd 作为系统服务运行时 cwd 不确定。
  - name: GWLINKD_UPGRADE_PROJECT_DIR
    value: ""
