# 网关订阅：同一批 OML 记录 POST 到网关内部端点（日志的**终点**）。
# 本地 json sink 保留用于肉眼验证「帧真的进来了」；权威副本在网关本地 NDJSON 里。
# 逐条发（batch_size = 1）：一条多行记录本身可达 1 MiB，批量会把网关那侧的 body 上限顶爆。
#
# ⚠ **暂时保持关闭**：网关的 `/api/v1/ingest/agent-logs` 只认旧字段名
# （`agent_id` / `observed_at` / `category`），而当前模型输出的是
# （`agent` / `ts` / `log_type`）—— 开了会整批 400，wparse 把每条都写进 rescue
# （实测 1 分钟 ~350 MB）。等网关侧加上别名（向后兼容）后再打开；
# 对应 wp-infra v1.1.4 的注释与 CHANGELOG。
