name: Scripts

# 栈脚本的回归测试：只盯 `scripts/`、`dev/tests/`、`sys/` 里的东西。
#
# 为什么单独一条工作流：2026-10-23 的升级失败在**手工环境**里永远复现不了 ——
# 交互式 shell 的 PATH 里有 Homebrew 的 openssl，而升级流程由 gwlinkd 派生，
# 解析到的是 macOS 自带的 LibreSSL（不认 `x509 -ext`），于是在 `set -e` + `pipefail`
# 下静默退 1。所以 `dev/tests/*.test.sh` 全部**故意用最小 PATH** 跑，
# 并且必须有 macOS 那一路（LibreSSL / bash 3.2 的差异只在那里能复现）。
on:
  push:
    paths:
      - "scripts/**"
      - "dev/**"
      - "sys/**"
      - ".github/workflows/scripts.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "dev/**"
      - "sys/**"
      - ".github/workflows/scripts.yml"

permissions:
  contents: read

jobs:
  # 静态检查：`dev/lint.sh`（CI 与本地同一条命令）。
  # 为什么单独一个 job：它只需要 ubuntu 一台，不必跑两次（macOS 那台很贵）。
  lint:
    name: Shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Ensure shellcheck
        run: command -v shellcheck >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y shellcheck)
      - run: ./dev/lint.sh

  # bind 挂载身份契约（只读）：同一挂载源被两种容器身份挂载、`0600` 配非 root 容器
  # 这类**配置错误**，必须在合并前拦住。
  #
  # 为什么不能直接用 `gops sys perms --check`：
  #   · 它在 macOS 上整段跳过（平台门禁）；
  #   · 完整 `--check` 还会报“挂载源不存在 / 模式没对齐” —— 那是**部署事实**，
  #     干净 checkout 上必然不满足，拿它做 CI 门槛任务永远红。
  #   `--config-only` 只做 compose 派生（不 stat、不 chmod），与平台无关。
  #   本任务需要一个带 `--config-only` 的 gops（从公开仓按 `GOPS_REF` 构建）。
  #   `GOPS_REF` 默认跟 `alpha`：契约检查的价值就在“上游一变就早知道”；
  #   要确定性可改成固定 tag（改动本文件即可）。
  compose-perms:
    name: Bind identity contract
    runs-on: ubuntu-24.04
    env:
      GOPS_REF: alpha
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build gops (${{ env.GOPS_REF }})
        run: |
          set -eu
          git clone --depth 1 --branch "${GOPS_REF}" \
            https://github.com/galaxio-labs/galaxy-ops /tmp/gops-src
          cargo build --release --locked \
            --manifest-path /tmp/gops-src/Cargo.toml --bin gops
          echo "/tmp/gops-src/target/release" >> "${GITHUB_PATH}"
      # `.env` 由 localize 生成（离线、不跑 gx 流程）；没有它 compose 里的 ${VAR}
      # 会展开成空串，派生出来的是空路径。
      - name: Render .env (offline)
        run: gops sys localize --no-flow --only --no-perms-check
      - name: Validate bind identity contract
        run: ./dev/check-compose-perms.sh

  shell-tests:
    name: Shell regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@v7
      - name: Run dev/tests
        run: |
          set -eu
          fail=0
          for t in dev/tests/*.test.sh; do
            echo "::group::${t}"
            if bash "${t}"; then echo "PASS ${t}"; else echo "::error file=${t}::${t} 失败"; fail=1; fi
            echo "::endgroup::"
          done
          exit "${fail}"
