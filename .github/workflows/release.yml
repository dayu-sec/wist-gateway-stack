name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  # 打包：整仓内容（除 CI 自身的 .github）打成部署包。
  # 用 git archive 出包，只收 git 跟踪的内容 —— sysrun/bin/（约 92M 本地二进制）、
  # sysrun/data-plane/{data,.run}/、configs/、.env、sys/resolved_vars.yml、values/、
  # _gal/.report 等都未入 git，天然不入包。
  package:
    name: Package deployment bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build tarball
        run: |
          set -eu
          bundle="wist-gateway-stack-${GITHUB_REF_NAME}"
          git archive \
            --format=tar \
            --prefix="${bundle}/" \
            HEAD -- . ':(exclude).github' > "${bundle}.tar"
          gzip -9 "${bundle}.tar"
          echo "包内文件数：$(tar -tzf "${bundle}.tar.gz" | wc -l)"
          ls -lh "${bundle}.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: wist-gateway-stack
          path: wist-gateway-stack-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # 发布到 GitHub Release，供中心作为版本制品下载。
  release:
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wist-gateway-stack
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.tar.gz
